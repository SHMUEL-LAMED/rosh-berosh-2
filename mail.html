<html lang="he" dir="rtl">
<head>

  <title>טיוטת מייל למאזינים — ראש בראש</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06080f">
  <link rel="icon" href="assets/img/medallion.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app-update.js" defer data-sw="off"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Karantina:wght@300;400;700&display=swap">
  <link rel="stylesheet" href="assets/css/rosh.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/features.css">
  <link rel="stylesheet" href="assets/css/mail.css">
</head>
<body data-page="mail">
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <div class="shell">
    <div id="site-header"></div>

    <main id="main">
      <div class="admin-top">
        <div class="admin-title">
          <p class="kicker">רשימת התפוצה</p>
          <h1>טיוטת מייל למאזינים</h1>
        </div>
        <p class="help mail-lead">מייל מעוצב — על תוכנית חדשה, סיכום של כמה תוכניות, או הודעה חופשית — שנוצר כטיוטה בג'ימייל שלכם, עם כל רשימת התפוצה בעותק מוסתר. לרשימה שום דבר לא נשלח עד שתלחצו "שליחה" בג'ימייל.</p>
      </div>

      <!-- השער: רק מנהל מחובר -->
      <section id="mail-gate" class="card" role="status" hidden>
        <div class="state">
          <span class="mark">✉</span>
          <h3>למנהלי התוכנית</h3>
          <p id="mail-gate-text">בודקים מי מחובר…</p>
          <div class="google-slot" id="mail-google"></div>
          <a class="btn" href="admin.html">לאזור הניהול</a>
        </div>
      </section>

      <section id="mail-host" class="card mail-page-card">
        <div class="state"><span class="notice-spinner" aria-hidden="true"></span><p>בודקים מי מחובר…</p></div>
      </section>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/newsletter.js"></script>
  <script src="assets/js/sheet-read.js"></script>
  <script src="assets/js/mail-composer.js"></script>
  <script src="assets/js/mail.js"></script>
</body>
</html>
