name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # פעם ביום: בניית מפת האתר ודפי התוכניות מחדש, כדי שתוכניות חדשות יופיעו בגוגל
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    # שום דבר לא עולה לאוויר אם בדיקה נכשלה
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the saved catalog copy (data/episodes.json) from the live catalog
        run: node scripts/build-saved-catalog.mjs
      - name: Build the sitemap from the live catalog
        run: node scripts/build-sitemap.mjs
      - name: Build a static page per episode (episodes/<slug>.html, for search engines)
        run: node scripts/build-episode-pages.mjs
      # כל פריסה מסמנת את קובצי העיצוב והסקריפטים של האתר ב־?v=<commit>. לשונית שנפתחה לפני הפריסה
      # מזהה את זה במעבר לדף אחר (router.js) וטוענת את הדף מחדש, במקום לצייר דף חדש עם קבצים ישנים;
      # ובלי מעבר — version.json עם אותו ערך, ש־app-update.js בודק (עדכון בכוח).
      - name: Stamp this version on the site's own CSS and JS links
        run: |
          v="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i -E "s#((href|src)=\"assets/(css|js)/[a-z0-9-]+\.(css|js))\"#\1?v=${v}\"#g"
          missing=$(grep -L "rosh.css?v=${v}" index.html episode.html episodes/*.html || true)
          if [ -n "$missing" ]; then echo "stamp missing in: $missing"; exit 1; fi
          # עדכון בכוח: דפים פתוחים משווים את זה ל־?v= שלהם ונטענים מחדש כשהוא אחר (app-update.js)
          printf '{"v":"%s"}\n' "$v" > version.json
          missing=$(grep -L "app-update.js?v=${v}" *.html episodes/*.html || true)
          if [ -n "$missing" ]; then echo "app-update stamp missing in: $missing"; exit 1; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
